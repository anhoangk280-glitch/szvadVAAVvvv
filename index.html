<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Women’s Day 💖</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background-image:radial-gradient(rgba(255,255,255,.28) 1.2px,transparent 1.5px),radial-gradient(ellipse at 50% 30%,#fff1f6 0%,#ffc6da 42%,#f58fb6 100%);background-size:24px 24px,auto;background-attachment:fixed,fixed;color:#6b1a40;font-family:"Quicksand","Segoe UI",system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
#heartBtn{position:relative;width:150px;height:135px;background:none;border:0;cursor:pointer;animation:beat 1.2s infinite;transition:transform .7s ease-in}
#heartBtn svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(255,77,136,.45))}
#heartBtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;padding-bottom:8px}
#heartBtn.go{animation:none;transform:scale(.04)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes fade{from{opacity:0}}
.photos{display:flex;flex-wrap:wrap;gap:26px 24px;justify-content:center;position:relative;z-index:3;opacity:0;animation:fade 1.2s 2.4s forwards;padding-top:14px}
.ph{position:relative;width:168px;height:222px;padding:10px 10px 0;background:#fffdf8;border-radius:6px;box-shadow:0 1px 0 #f2d7e0,0 14px 28px rgba(120,0,50,.35),0 4px 8px rgba(120,0,50,.2);cursor:pointer;display:flex;flex-direction:column;align-items:center;color:#8a2050;transition:transform .45s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;animation:popin .9s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:var(--d,0s)}
.ph.big{width:208px;height:262px}
.ph:nth-child(odd){transform:rotate(-3deg)}.ph:nth-child(even){transform:rotate(3deg)}
.ph:hover{transform:translateY(-8px) rotate(0) scale(1.06);box-shadow:0 26px 44px rgba(120,0,50,.45)}
.ph::before{content:"";position:absolute;top:-12px;left:50%;width:74px;height:24px;transform:translateX(-50%) rotate(-4deg);background:linear-gradient(90deg,rgba(255,240,190,.9),rgba(255,214,120,.8));box-shadow:0 1px 3px rgba(0,0,0,.18);border-left:2px dashed rgba(255,255,255,.55);border-right:2px dashed rgba(255,255,255,.55);z-index:2}
.ph.big::before{width:96px}
.ph .pic{width:100%;flex:1;border-radius:3px;background:linear-gradient(135deg,#ffe3ee,#ffc6da) center/cover no-repeat;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -24px 40px rgba(120,0,50,.14)}
.ph .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 4.8s ease-in-out infinite;animation-delay:calc(var(--d,0s) + 1.2s);pointer-events:none}
.ph .cap{font-family:"Brush Script MT","Segoe Script",cursive;font-size:21px;line-height:1;padding:9px 0 8px;color:#c02a6c}
.ph b{font-size:34px}
@keyframes popin{from{opacity:0;transform:translateY(60px) scale(.5) rotate(-12deg)}}
@keyframes sheen{0%,55%,100%{transform:translateX(-120%)}80%{transform:translateX(120%)}}
#finale h1{filter:drop-shadow(0 0 18px rgba(255,255,255,.6))}
.scene{box-shadow:0 0 0 6px rgba(255,255,255,.35),0 0 0 11px rgba(255,255,255,.14),0 24px 50px rgba(120,0,50,.5)!important}

.star{position:fixed;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{opacity:.15}}
#ttl{position:fixed;top:12px;left:0;right:0;text-align:center;font-family:"Brush Script MT","Segoe Script",cursive;color:#fff;font-size:clamp(20px,4.5vw,30px);line-height:1.3;text-shadow:0 2px 0 #b8336e,0 0 14px rgba(255,255,255,.9);z-index:3;display:none;animation:fade 2s}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:none}
#deco{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#tap{position:fixed;left:0;right:0;bottom:6vh;text-align:center;z-index:3;color:#fff;font-size:17px;font-weight:700;opacity:0;transition:opacity 1s;text-shadow:0 2px 0 #b8336e,0 0 12px rgba(255,255,255,.9);animation:beat 1.8s infinite;pointer-events:none}
#letterBox{position:fixed;z-index:4;opacity:0;pointer-events:none;transition:opacity 1.4s,transform 1.4s;left:5vw;top:120px;bottom:24px;width:min(430px,40vw);display:flex;flex-direction:column;overflow-y:auto;transform:none}
#letterBox.show{opacity:1;pointer-events:auto;transform:none}
#letterBox>.letter{margin:auto 0}
@media(max-width:820px){#letterBox{left:50%;top:34vh;bottom:3vh;width:min(92vw,430px);transform:translate(-50%,0);overflow:auto;display:block}#letterBox.show{transform:translate(-50%,0)}}
.letter{width:100%;background:#fffaf3;color:#6b2a45;border-radius:14px;padding:30px 26px;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.45);border:3px dashed #ff9ec0;outline:8px solid #ffd1e1;outline-offset:-14px;background-image:radial-gradient(#ffe0ea 1.5px,transparent 1.5px);background-size:18px 18px}
.letter .d{position:absolute;font-size:24px;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(14deg) translateY(-4px)}}
.letter h2{font-family:"Brush Script MT","Segoe Script",cursive;font-size:44px;margin:6px 0 10px;text-align:center;color:#e0246d;text-shadow:2px 2px 0 #ffd1e1}
.letter p{font-size:17px;line-height:1.7;margin:0;white-space:pre-wrap;min-height:170px;position:relative}
.sign{text-align:right;font-family:"Brush Script MT","Segoe Script",cursive;font-size:22px;margin-top:12px;color:#e0246d;transition:opacity 1s}
#finale{position:fixed;inset:0;z-index:20;display:none;overflow:auto;text-align:center;padding:40px 14px 60px;background:radial-gradient(circle at 50% 25%,#fff0f6 0%,#ffc2d9 32%,#ff86b0 68%,#e8437f 100%)}
#finale::before{content:"";position:absolute;left:50%;top:38%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.2) 0deg 6deg,transparent 6deg 18deg);animation:spin 70s linear infinite;pointer-events:none;z-index:0;-webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
#fgl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#finale.on{display:block;animation:fade 1s}
#fgl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
@keyframes fade{from{opacity:0}}
#finale h1{margin:10px 0 6px;font-size:clamp(44px,12vw,120px);line-height:1.02;font-weight:900;color:#fff;text-shadow:0 4px 0 #e0246d,0 8px 0 #b01658,0 14px 24px rgba(120,0,50,.5);position:relative;z-index:3}
#finale h1 .w{display:inline-block;white-space:nowrap}
#finale h1 i{display:inline-block;font-style:normal;animation:letter .9s cubic-bezier(.3,1.6,.5,1) both,pulse 2s ease-in-out 3s infinite}
@keyframes letter{0%{transform:translateY(-120px) scale(.2) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
#finale .sub{font-size:20px;font-weight:700;margin:12px 0 26px;color:#fff;position:relative;z-index:3;text-shadow:0 2px 6px rgba(150,0,60,.5)}
.fh{position:fixed;bottom:-60px;animation:rise linear infinite;pointer-events:none;z-index:2}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
.hint,#again{position:relative;z-index:3;margin-top:22px;color:#fff;font-size:14px}
#again{background:#fff;color:#e0246d;border:0;border-radius:20px;padding:9px 22px;font-weight:700;cursor:pointer;font-size:15px}
.scene{position:relative;z-index:3;width:min(94vw,760px);aspect-ratio:800/440;margin:0 auto 26px;border-radius:24px;background:radial-gradient(ellipse at 50% 40%,#4a1f2c,#240d16 80%);border:3px solid #ffd1e1;box-shadow:0 14px 30px rgba(120,0,50,.45);overflow:hidden}
#figs{width:100%;height:100%;display:block}

/* ---------- phát nhạc ---------- */
#musicControl{position:fixed;right:14px;top:14px;z-index:30;display:none;align-items:center;gap:8px;padding:10px 14px;border:1px solid #ffd1e1;border-radius:24px;background:rgba(70,15,40,.88);color:#fff;font:600 14px/1.2 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer}
#musicControl.visible{display:flex}
#musicControl:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ph,.fh{will-change:transform}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
.ph{animation:popin .9s cubic-bezier(.3,1.5,.5,1) backwards var(--d,0s),bob 5s ease-in-out calc(var(--d,0s) + 1.2s) infinite}
@keyframes blob{0%,100%{border-radius:4px 10px 6px 12px}33%{border-radius:12px 4px 10px 6px}66%{border-radius:6px 12px 4px 10px}}
.ph .pic{animation:blob 10s ease-in-out infinite}

.heroCard{position:relative;z-index:3;width:min(74vw,300px);aspect-ratio:255/350;margin:8px auto 28px}
.heroCard .halo{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(255,226,238,.55) 36%,rgba(255,150,190,0) 70%);filter:blur(8px);animation:halo 4.5s ease-in-out infinite;z-index:0}
@keyframes halo{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
.heroCard .stage{position:relative;z-index:1;width:100%;height:100%;animation:enter 1.8s cubic-bezier(.2,.8,.2,1) both,float 6s ease-in-out 1.8s infinite}
@keyframes enter{from{opacity:0;filter:blur(14px);transform:translateY(30px) scale(.9)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
#hero{width:100%;height:100%;object-fit:contain;display:block;animation:breathe 6s ease-in-out 1.8s infinite;-webkit-mask:radial-gradient(ellipse 60% 62% at 50% 52%,#000 66%,transparent 100%);mask:radial-gradient(ellipse 60% 62% at 50% 52%,#000 66%,transparent 100%)}
@keyframes breathe{50%{scale:1.012}}
.heroCard .sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%);mix-blend-mode:soft-light;animation:sheenMove 5.5s ease-in-out 2s infinite;-webkit-mask:radial-gradient(ellipse 60% 62% at 50% 52%,#000 66%,transparent 100%);mask:radial-gradient(ellipse 60% 62% at 50% 52%,#000 66%,transparent 100%);pointer-events:none}
@keyframes sheenMove{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.heroCard .tw{position:absolute;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 18px #ffd36b;animation:twk 2.4s ease-in-out infinite;z-index:2}
@keyframes twk{0%,100%{opacity:0;scale:.4}50%{opacity:1;scale:1.3}}
</style>
</head>

<!-- Đặt file nhạc tên music.mp3 cùng thư mục với index.html -->

</div>

// lấy mẫu sao theo lưới; bộ phận vẽ sau ghi đè bộ phận trước; cạnh hình được làm sáng
function sampleFig(p){
  var S=6,map={},PART_ORDER=['hair','body','leg','arm','head'];
  PART_ORDER.forEach(function(part){
    var c=document.createElement('canvas');c.width=FW;c.height=FH;var g=c.getContext('2d');person(g,p,part);
    var d=g.getImageData(0,0,FW,FH).data;
    var col=part==='head'?'#fff4e8':part==='hair'?HAIR[p.c]:GC[p.c];
    for(var y=3;y<FH;y+=S)for(var x=3;x<FW;x+=S){if(d[(y*FW+x)*4+3]>128)map[x+','+y]={x:x,y:y,c:col}}
  });
  var out=[];
  Object.keys(map).forEach(function(k){
    var q=map[k],x=q.x,y=q.y;
    var e=!map[(x-S)+','+y]||!map[(x+S)+','+y]||!map[x+','+(y-S)]||!map[x+','+(y+S)];
    out.push({x:x,y:y,e:e,c:q.c});
  });
  return out;
}
function initScene(){
  var dpr=Math.min(2,window.devicePixelRatio||1);figC.width=FW*dpr;figC.height=FH*dpr;fctx.setTransform(dpr,0,0,dpr,0,0);
  fstars=[];
  PEOPLE.forEach(function(p){
    p.hand=handOf(p);
    sampleFig(p).forEach(function(q){fstars.push({x:q.x+rnd(-.6,.6),y:q.y+rnd(-.6,.6),sx:rnd(-40,FW+40),sy:rnd(-40,FH+40),d:rnd(0,1000),ph:rnd(0,6.28),e:q.e,c:q.c})});

}
function sceneFrame(now){
  var t=now-fT0;fctx.clearRect(0,0,FW,FH);
  var gl=fctx.createRadialGradient(400,190,10,400,190,280);gl.addColorStop(0,'rgba(255,170,130,'+(.2+.06*Math.sin(t/700))+')');gl.addColorStop(1,'rgba(255,170,130,0)');fctx.fillStyle=gl;fctx.fillRect(0,0,FW,FH);
  for(var i=0;i<fstars.length;i++){
    var s=fstars[i],p=cl((t-s.d)/2300),e=1-Math.pow(1-p,3);
    var x=s.sx+(s.x-s.sx)*e,y=s.sy+(s.y-s.sy)*e;
    if(p>=1){x+=Math.sin(t/900+s.ph)*.9;y+=Math.cos(t/1100+s.ph)*.9}
    var z=s.e?3.4:2.2;
    fctx.globalAlpha=(.7+.3*Math.sin(t/500+s.ph*3))*(s.e?1:.85)*(.4+.6*e);
    fctx.fillStyle=s.c;fctx.fillRect(x-z/2,y-z/2,z,z);
  }
  fctx.globalAlpha=1;
  if(t>=nextFly){var k=Math.round((nextFly-3400)/1000),A=PEOPLE[BOYS[k%3]].hand,B=PEOPLE[RECV[k%3]].hand;fly.push({t0:t,A:A,B:B,sp:spr[(k*7)%spr.length]});nextFly+=1000}
  for(var m=fly.length-1;m>=0;m--){
    var fl=fly[m],u=(t-fl.t0)/1500;if(u>=1){fly.splice(m,1);continue}
    var e2=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,cx=(fl.A[0]+fl.B[0])/2,cy=Math.min(fl.A[1],fl.B[1])-120;
    var fx=(1-e2)*(1-e2)*fl.A[0]+2*(1-e2)*e2*cx+e2*e2*fl.B[0],fy=(1-e2)*(1-e2)*fl.A[1]+2*(1-e2)*e2*cy+e2*e2*fl.B[1];
    var sc=36*(.75+.25*Math.sin(Math.PI*u));
    fctx.save();fctx.translate(fx,fy);fctx.rotate(u*2.5);fctx.drawImage(fl.sp,-sc/2,-sc/2,sc,sc);fctx.restore();
  }
  requestAnimationFrame(sceneFrame);
}
/* cảnh cuối: cô giáo cầm bó hướng dương và các bạn, vẽ một lần, đứng yên */

    }
    if(o.folder)rbox(x-r*.55,ws+4,r*1.1,r*1.5,3,'#ffd166');
    if(o.bag){line([[x-r*.7,sh+4],[x+r*.8,ws+6]],'#8a5a2b',3);rbox(x+r*.2,sh+70,r*.95,r*.85,4,'#c98a4b')}
    if(o.dress){line([[x-r*.7,sh+4],[x+r*.8,ws+60]],'#8a5a2b',3);rbox(x+r*.2,sh+70,r*.95,r*.85,4,'#c98a4b')}
    if(o.hairTop)ell(x,hy-r*.12,r*1.05,r*.95,0,o.hair);
    face(x,hy+r*.08,r*.9);
    if(o.bangs)ell(x,hy-r*.42,r*.82,r*.36,0,o.hair);

  function sun(x,y,r){

    circ(x,y,r*.5,'#8a5314');circ(x,y,r*.32,'#6b3d0c');
  }
  // bóng đất
  ell(400,424,340,11,0,'rgba(150,80,100,.13)');
  // cô giáo

  poly([[292,176],[368,176],[400,250],[414,420],[248,420],[262,250]],TB);

  g.beginPath();g.arc(312,122,11,0,6.2832);g.stroke();g.beginPath();g.arc(348,122,11,0,6.2832);g.stroke();
  g.beginPath();g.moveTo(323,122);g.lineTo(337,122);g.stroke();
  circ(312,124,3,INK);circ(348,124,3,INK);
  g.strokeStyle=INK;g.lineWidth=2.5;g.lineCap='round';g.beginPath();g.arc(330,140,8,.2,Math.PI-.2);g.stroke();
  ell(298,140,6,4,0,'#ffa9a9');ell(362,140,6,4,0,'#ffa9a9');

/* ---------- nền hồng & khung trang trí: hoa góc, dây hoa hai cạnh, khung kép, lấp lánh ---------- */
var dc=document.getElementById('deco'),dx=dc.getContext('2d'),DW=0,DH=0,DU=1,EDGES=[],CORN=[],BOK=[],SPK=[];
var CORN_DEF=[[30,30,46,1],[66,22,30,0],[22,66,30,0],[62,62,26,0],[100,30,18,0],[30,100,18,0],[96,96,16,0]];
var CORN_LEAF=[[14,14,-0.2,34],[14,14,1.2,30],[50,12,0.2,26],[12,50,1.4,26],[78,40,-0.5,22],[40,78,2.0,22]];
var CSIGN=[[1,1],[-1,1],[-1,-1],[1,-1]];
function pickSp(deepChance){return Math.random()<deepChance?spr2[Math.floor(rnd(0,spr2.length))]:spr[Math.floor(rnd(0,spr.length))]}
function bakeBokeh(b){var c2=document.createElement('canvas');c2.width=c2.height=64;var q=c2.getContext('2d');var gr=q.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,'+b.a+')');gr.addColorStop(1,'rgba(255,255,255,0)');q.fillStyle=gr;q.fillRect(0,0,64,64);b.img=c2}
function decoLayout(){
  var d=Math.min(2,window.devicePixelRatio||1);DW=innerWidth;DH=innerHeight;
  dc.width=DW*d;dc.height=DH*d;dx.setTransform(d,0,0,d,0,0);
  var u=DU=Math.max(.75,Math.min(1.5,Math.min(DW,DH)/400));
  var m=18*u,step=42*u;
  var corners=[[m,m],[DW-m,m],[DW-m,DH-m],[m,DH-m]];
  var dirs=[[1,0],[0,1],[-1,0],[0,-1]],ins=[[0,1],[-1,0],[0,-1],[1,0]];
  EDGES=[];
  for(var e=0;e<4;e++){
    var a=corners[e],b=corners[(e+1)%4],L=Math.hypot(b[0]-a[0],b[1]-a[1]),cnt=Math.max(2,Math.round(L/step));
    var vine=[],flw=[];
    for(var j=0;j<=cnt*4;j++){var f=j/(cnt*4);vine.push({x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f,nx:ins[e][0],ny:ins[e][1],f:f})}
    for(var i=1;i<cnt;i++){var g2=i/cnt,fx2=a[0]+(b[0]-a[0])*g2,fy2=a[1]+(b[1]-a[1])*g2;
      flw.push({x:fx2,y:fy2,nx:ins[e][0],ny:ins[e][1],tx:dirs[e][0],ty:dirs[e][1],s:pickSp(.3),r:rnd(15,21)*u,ph:rnd(0,6.28),rot:rnd(0,6.28),side:(i%2?1:-1)})}
    EDGES.push({vine:vine,flw:flw});
  }
  CORN=corners.map(function(c,k){
    var sx=CSIGN[k][0],sy=CSIGN[k][1],cx=c[0],cy=c[1];
    var fl=CORN_DEF.map(function(q,n){return {x:cx+sx*q[0]*u,y:cy+sy*q[1]*u,r:q[2]*u,s:q[3]?pickSp(1):pickSp(.25),ph:rnd(0,6.28),rot:rnd(0,6.28)}});
    var lv=CORN_LEAF.map(function(q){var ang=Math.atan2(sy*Math.sin(q[2]),sx*Math.cos(q[2]));return {x:cx+sx*q[0]*u,y:cy+sy*q[1]*u,ang:ang,len:q[3]*u,ph:rnd(0,6.28)}});
    return {fl:fl,lv:lv};
  });
  BOK=[];for(var k2=0;k2<26;k2++)BOK.push({x:rnd(0,DW),y0:rnd(0,DH),r:rnd(10,38)*u,v:rnd(.008,.022)*u*60,a:rnd(.12,.3),ph:rnd(0,6.28)});
  BOK.forEach(bakeBokeh);
  SPK=[];for(var k3=0;k3<16;k3++){var side=k3%4;var px=side%2?rnd(0,DW):(side===0?rnd(0,DW):rnd(0,DW)),py;
    py=side===0?rnd(0,m*2.6):side===1?rnd(DH-m*2.6,DH):rnd(0,DH);SPK.push({x:px,y:py,ph:rnd(0,6.28),r:rnd(4,8)*u})}
}
function rrPath(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function drawLeaf(g,x,y,ang,len,wid){
  g.save();g.translate(x,y);g.rotate(ang);var gr=g.createLinearGradient(0,0,len,0);gr.addColorStop(0,'#2f6b3c');gr.addColorStop(1,'#8fcb7a');
  g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(len*.3,-wid,len*.8,-wid*.8,len,0);g.bezierCurveTo(len*.8,wid*.8,len*.3,wid,0,0);g.fill();
  g.strokeStyle='rgba(20,60,30,.5)';g.lineWidth=.8;g.beginPath();g.moveTo(0,0);g.lineTo(len*.85,0);g.stroke();g.restore();
}
function drawSpr(g,img,x,y,r,rot){g.save();g.translate(x,y);g.rotate(rot);var s2=r*1.15;g.drawImage(img,-s2,-s2,s2*2,s2*2);g.restore()}
function decoDraw(t){
  var g=dx,u=DU;
  g.clearRect(0,0,DW,DH);
  // ánh sáng hồng trôi lên
  for(var i=0;i<BOK.length;i++){var b=BOK[i];var y=((b.y0-t*b.v)%(DH+80)+DH+80)%(DH+80)-40,x=b.x+Math.sin(t/1600+b.ph)*18*u;
    g.drawImage(b.img,x-b.r,y-b.r,b.r*2,b.r*2)}
  // khung kép
  g.save();g.lineWidth=2.4*u;g.strokeStyle='rgba(255,255,255,.92)';rrPath(g,9*u,9*u,DW-18*u,DH-18*u,26*u);g.stroke();
  g.setLineDash([4*u,7*u]);g.lineWidth=1.6*u;g.strokeStyle='rgba(255,226,140,.95)';rrPath(g,17*u,17*u,DW-34*u,DH-34*u,20*u);g.stroke();
  g.setLineDash([]);g.lineWidth=1*u;g.strokeStyle='rgba(180,40,100,.35)';rrPath(g,3*u,3*u,DW-6*u,DH-6*u,30*u);g.stroke();g.restore();
  // dây hoa hai cạnh
  EDGES.forEach(function(ed){
    var pts=ed.vine.map(function(p){var off=(9+2*Math.sin(t/900+p.f*12))*u;return {x:p.x+p.nx*off,y:p.y+p.ny*off}});
    g.save();g.strokeStyle='rgba(95,160,90,.85)';g.lineWidth=2.2*u;g.lineCap='round';g.beginPath();
    pts.forEach(function(p,k){k?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.stroke();g.restore();
    ed.flw.forEach(function(p,k){
      var off=(9+2*Math.sin(t/900+p.ph))*u+4*u,sway=Math.sin(t/900+p.ph)*.12;
      var px=p.x+p.nx*off,py=p.y+p.ny*off;
      var ang=Math.atan2(p.ty,p.tx);
      drawLeaf(g,px,py,ang+.8+sway,20*u,6*u);drawLeaf(g,px,py,ang+Math.PI-.8-sway,18*u,5.5*u);
      drawSpr(g,p.s,px,py,p.r,p.rot+sway*2);
    });
  });
  // cụm hoa ở 4 góc
  CORN.forEach(function(c){
    c.lv.forEach(function(l){var sw=Math.sin(t/1200+l.ph)*.07;drawLeaf(g,l.x,l.y,l.ang+sw,l.len,l.len*.28)});
    c.fl.forEach(function(p){var sw=Math.sin(t/1200+p.ph)*.06;drawSpr(g,p.s,p.x,p.y,p.r,p.rot+sw)});
  });
  // lấp lánh
  for(var k=0;k<SPK.length;k++){var s=SPK[k],a=.5+.5*Math.sin(t/420+s.ph),r=s.r*(.6+.4*a);
    g.save();g.globalAlpha=.35+.65*a;g.translate(s.x,s.y);g.fillStyle='#fff';g.beginPath();
    for(var q=0;q<8;q++){var ang=q/8*6.2832,rr=q%2?r*.3:r;g.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}
    g.closePath();g.fill();g.restore()}
}
decoLayout();
addEventListener('resize',decoLayout);
(function decoLoop(now){decoDraw(now);requestAnimationFrame(decoLoop)})(performance.now());

var bgMusic=document.getElementById('bgMusic');

function updateMusicButton(playing){
  musicControl.textContent=playing?'❚❚ Tạm dừng nhạc':'▶ Phát nhạc';
  musicControl.setAttribute('aria-label',playing?'Tạm dừng nhạc':'Phát nhạc');

async function playMusic(){
  try{
    await bgMusic.play();
    updateMusicButton(true);
  }catch(err){
    updateMusicButton(false);
    musicControl.title='Không phát được nhạc. Kiểm tra file music.mp3 có nằm cùng thư mục với index.html không.';
  }
}

};
